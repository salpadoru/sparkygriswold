name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "ci-build-error.txt"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npx next build --webpack 2>&1 | tee ci-build-output.txt
      - name: Save build diagnostics
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "# CI build diagnostics"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            cat ci-build-output.txt
          } > ci-build-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-build-error.txt
          git commit -m "CI build diagnostics [skip ci]" || true
          git push
      - name: Fail workflow when build fails
        if: steps.build.outcome == 'failure'
        run: exit 1
