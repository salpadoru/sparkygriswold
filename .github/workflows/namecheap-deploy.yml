name: Namecheap Deployment Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

      - name: Create Namecheap deployment package
        run: |
          zip -r sparky-namecheap.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "README.md" \
            -x ".gitignore"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: sparky-namecheap
          path: sparky-namecheap.zip
          retention-days: 7
