name: Namecheap Deployment Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

      - name: Assemble standalone Namecheap deployment
        run: |
          rm -rf namecheap-deploy
          mkdir -p namecheap-deploy/.next
          cp -R .next/standalone/. namecheap-deploy/
          cp -R .next/static namecheap-deploy/.next/static
          cp -R public namecheap-deploy/public

      - name: Create Namecheap deployment package
        run: |
          cd namecheap-deploy
          zip -r ../sparky-namecheap-standalone.zip .

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: sparky-namecheap-standalone
          path: sparky-namecheap-standalone.zip
          retention-days: 7
